version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gridwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gridwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: gridwise-api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/gridwise
      JWT_SECRET: gridwise-super-secret-jwt-key-2026
      LLM_API_KEY: ${LLM_API_KEY:-your_llm_api_key_here}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  client:
    build: ./client
    container_name: gridwise-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
