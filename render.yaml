services:
  - type: web
    name: gridwise
    env: node
    plan: free
    buildCommand: npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: ADMIN_EMAIL
        value: admin@gridwise.io
      - key: ADMIN_PASSWORD
        value: GridWise2026!
